name: Vérification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler l'interface
        run: npm run build
      - name: Compiler la démo statique
        run: npm run build:demo --ignore-scripts
      - name: Contrôle de sensibilité
        run: npm run controle:sensibilite
